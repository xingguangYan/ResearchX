name: validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  skill:
    name: skill spec + tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skill package (Agent Skills spec)
        run: python tests/validate_skill.py --strict
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Run offline test suite
        run: python -m pytest tests -q
      - name: Check JSON manifests
        run: make manifests
      - name: CLI smoke test (help + offline behaviour)
        run: |
          python skills/researchx/scripts/verify_citations.py --help > /dev/null
          python skills/researchx/scripts/search_literature.py --help > /dev/null
          python skills/researchx/scripts/prisma_screen.py --help > /dev/null
          python skills/researchx/scripts/analyze_methods.py --help > /dev/null
          python skills/researchx/scripts/generate_visuals.py --help > /dev/null
