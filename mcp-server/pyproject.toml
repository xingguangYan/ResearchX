[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "researchx-mcp"
version = "4.0.0"
description = "ResearchX MCP server — literature search, citation verification, PRISMA screening and method mining for any MCP client. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["mcp", "model-context-protocol", "research", "citation-verification", "prisma", "literature-review"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xingguangYan/ResearchX"
Source = "https://github.com/xingguangYan/ResearchX"

[project.scripts]
researchx-mcp = "researchx_mcp_server:main"

[tool.setuptools]
py-modules = ["researchx_mcp_server"]
